const nm=(c,k,l)=>k.split('|')[IX[l]];

let lang='fr',cat=0;try{const s=localStorage.getItem('lang');if(LG.includes(s))lang=s}catch(e){}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

function render(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 $$('[data-t]').forEach(e=>e.textContent=tr(e.dataset.t,lang));
 $('#nav').innerHTML=T.nav.split(';').map((s,i)=>`<a href="#${['menu','gallery','videos','book','contact'][i]}">${s.split('|')[IX[lang]]}</a>`).join('');
 $$('#flags button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
 $('#tabs').innerHTML=M.map((c,i)=>`<button role="tab" class="${i===cat?'on':''}" data-c="${i}">${c.t.split('|')[IX[lang]]}</button>`).join('');
 $('#items').innerHTML=M[cat].i.map(([k,p],n)=>`<div class="it" style="animation-delay:${n*40}ms"><span>${nm(M[cat],k,lang)}</span><i></i><b dir="ltr">${p==null?'—':p+' DH'}</b></div>`).join('');
 document.title='Snack Al Baraka — Bar & Grill, Agdz';
}
function setLang(l){lang=l;try{localStorage.setItem('lang',l)}catch(e){}render()}
$('#flags').innerHTML=LG.map(l=>`<button data-l="${l}" aria-label="${AL[l]}">${FL[FK[l]]}</button>`).join('');
$('#flags').onclick=e=>{const b=e.target.closest('button');if(b)setLang(b.dataset.l)};
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){cat=+b.dataset.c;render()}};

/* gallery + lightbox + videos: sections are ALWAYS shown; missing files show a placeholder */
const DIRS=['','images/','img/','assets/','assets/images/','media/','videos/'];
function probe(names,kind,cb){let i=0;const next=()=>{if(i>=names.length)return cb(null);const src=names[i++];
 if(kind==='img'){const m=new Image();m.onload=()=>cb(src);m.onerror=next;m.src=src}
 else{const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>cb(src);v.onerror=next;v.src=src}};next()}
const gal=$('#gal'),lb=$('#lb'),lbi=lb.querySelector('img');let cur=0,ok=[];
const show=()=>{lbi.src=ok[cur];lb.classList.add('on')},step=d=>{cur=(cur+d+ok.length)%ok.length;show()};
for(let n=1;n<=10;n++){const f=document.createElement('figure');f.className='ph';f.dataset.n=n+'.webp';gal.append(f);
 probe(DIRS.map(d=>`${d}${n}.webp`),'img',src=>{if(!src)return;f.classList.remove('ph');const im=new Image();im.src=src;im.alt='Snack Al Baraka';im.loading='lazy';f.append(im);
  f.onclick=()=>{ok=[...gal.querySelectorAll('img')].map(i=>i.src);cur=ok.indexOf(im.src);show()}})}
lb.querySelector('.x').onclick=()=>lb.classList.remove('on');lb.querySelector('.pv').onclick=()=>step(-1);lb.querySelector('.nx').onclick=()=>step(1);
lb.onclick=e=>{if(e.target===lb)lb.classList.remove('on')};
addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowRight')step(lang==='ar'?-1:1);if(e.key==='ArrowLeft')step(lang==='ar'?1:-1)});
const vw=$('#vids');
for(let k=1;k<=3;k++){const box=document.createElement('div');box.className='vb ph';box.dataset.n='video '+k;vw.append(box);
 const names=[];DIRS.forEach(d=>['video'+k+'.mp4',k+'.mp4','video-'+k+'.mp4','vid'+k+'.mp4','video'+k+'.webm','video'+k+'.mov'].forEach(x=>names.push(d+x)));
 probe(names,'vid',src=>{if(!src)return;box.classList.remove('ph');const v=document.createElement('video');v.src=src;v.controls=true;v.playsInline=true;v.preload='metadata';box.append(v)})}

/* booking -> WhatsApp */
$('#d').min=new Date().toISOString().slice(0,10);
$('#bf').onsubmit=e=>{e.preventDefault();
 const n=$('#n').value.trim(),d=$('#d').value,h=$('#h').value,p=$('#p').value,o=$('#o').value.trim();
 if(!n||!d||!h||!(+p>0)){alert(tr('fErr',lang));return}
 const ds=new Date(d+'T12:00').toLocaleDateString(LOC[lang],{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 const msg=[tr('wMsg',lang),`${tr('wN',lang)}: ${n}`,`${tr('wD',lang)}: ${ds}`,`${tr('wH',lang)}: ${h}`,`${tr('wP',lang)}: ${p}`,`${tr('wO',lang)}: ${o||'-'}`].join('\n');
 const url=`https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`;
 if(!window.open(url,'_blank','noopener'))location.href=url};

/* header, reveal */
const hd=$('#hd');addEventListener('scroll',()=>hd.classList.toggle('s',scrollY>40),{passive:true});
const io=new IntersectionObserver(a=>a.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.15});
$$('.rv').forEach(e=>io.observe(e));$('#yr').textContent=new Date().getFullYear();
render();
</script>
